[package]
name = "regent-protogen"
version = "0.1.0"
edition = "2024"
publish = false
description = "Developer tool: generates regent-sdk's protobuf mirror (proto/regent/v1/model.proto) and its Rust conversions"

[dependencies]
syn        = { version = "2", features = ["full", "extra-traits"] }
quote      = "1"
proc-macro2 = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
