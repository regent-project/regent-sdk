[package]
name        = "regent-sdk"
version     = "0.23.0"
edition     = "2024"
authors     = ["Romain SUZANNE <romzorus591@gmail.com>"]
repository  = "https://github.com/regent-project/regent-sdk"
license     = "Apache-2.0"
description = "Multi-paradigm configuration management system as a library"
keywords    = ["automation", "configuration", "management", "infrastructure", "observability"]
categories  = ["config", "command-line-utilities"]

[dependencies]
bytes                           = "1.12.1"
chrono                          = { version = "0.4.45", features = ["serde"] }
nanoid                          = "0.5.0"
russh                           = "0.65.1"
rustls-pki-types                = "1"
serde                           = { version = "1.0.229", features= ["derive"] }
serde_json                      = "1.0.154"
shhoq                           = "0.1.2"
tera                            = "2.4.0"
# windows feature: PowerShell file transfer and in-process line edits
base64                          = { version = "0.22", optional = true }
regex                           = { version = "1", optional = true }
thiserror                       = "2.0.21"
tokio                           = { version = "1.54.1", features = ["rt-multi-thread", "time", "macros", "process"] }
tokio-util                      = { version = "0.7", default-features = false }
tracing                         = "0.1.44"
yaml_serde                      = "0.10"
humantime-serde                 = "1.1.1"
schemars                        = { version = "1.2.3", optional = true, features = ["chrono04"] }

aws-sdk-secretsmanager          = { version = "1.125.0", optional = true }
aws-config                      = { version = "1.13.0", features = ["behavior-version-latest"], optional = true }
google-cloud-secretmanager-v1   = { version = "1.14.0", optional = true }
google-cloud-gax                = { version = "1.15.0", optional = true }

# `proto` feature: Google's protobuf runtime, pinned to the exact version matching
# the required `protoc` (36.1, see build.rs)
protobuf                        = { version = "=4.36.1-release", optional = true }
# `grpc` feature
tonic                           = { version = "0.14", optional = true, default-features = false, features = ["codegen", "transport", "router"] }

[profile.release]
lto = true

[lib]
doctest = false

[dev-dependencies]
tokio-stream        = { version = "0.1", features = ["net"] }
tracing-subscriber  = "0.3.23"
axum                = "0.8.9"
chrono              = "0.4.45"


[features]
aws-secretsmanager  = ["dep:aws-config", "dep:aws-sdk-secretsmanager"]
gcp-secretmanager   = ["dep:google-cloud-secretmanager-v1", "dep:google-cloud-gax"]
windows            = ["dep:base64", "dep:regex"]
# Protobuf mirror of RegentTaskResult (proto/regent/v1/model.proto). Needs protoc 36.1.
proto              = ["dep:protobuf", "dep:protobuf-codegen"]
# Reporting service (proto/regent/v1/reporting.proto): tonic client/server stubs.
grpc               = ["proto", "dep:tonic", "dep:tonic-build"]
# JSON Schema of expected states and attributes (schemars), e.g. to build
# attribute forms in a UI: `regent_sdk::schema`.
schema             = ["dep:schemars"]

[build-dependencies]
protobuf-codegen    = { version = "=4.36.1-release", optional = true }
tonic-build         = { version = "0.14", optional = true, default-features = false, features = ["transport"] }


