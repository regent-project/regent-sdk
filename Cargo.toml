[package]
name        = "regent-sdk"
version     = "0.17.0"
edition     = "2024"
authors     = ["Romain SUZANNE <romzorus591@gmail.com>"]
repository  = "https://github.com/regent-project/regent-sdk"
license     = "Apache-2.0"
description = "Multi-paradigm configuration management system as a library"
keywords    = ["automation", "configuration", "management", "infrastructure", "observability"]
categories  = ["config", "command-line-utilities"]

[dependencies]
bytes                           = "1.12.1"
chrono                          = "0.4.45"
nanoid                          = "0.5.0"
russh                           = "0.63.3"
rustls-pki-types                = "1"
serde                           = { version = "1.0.229", features= ["derive"] }
serde_json                      = "1.0.154"
shhoq                           = "0.1.2"
tera                            = "2.4.0"
thiserror                       = "2.0.21"
tokio                           = { version = "1.54.1", features = ["rt-multi-thread", "time", "macros", "process"] }
tracing                         = "0.1.44"
yaml_serde                      = "0.10"
humantime-serde                 = "1.1.1"

aws-sdk-secretsmanager          = { version = "1.123.0", optional = true }
aws-config                      = { version = "1.13.0", features = ["behavior-version-latest"], optional = true }
google-cloud-secretmanager-v1   = { version = "1.14.0", optional = true }
google-cloud-gax                = { version = "1.15.0", optional = true }

[profile.release]
lto = true

[lib]
doctest = false

[dev-dependencies]
tracing-subscriber  = "0.3.23"
axum                = "0.8.9"
chrono              = "0.4.45"


[features]
aws-secretsmanager  = ["dep:aws-config", "dep:aws-sdk-secretsmanager"]
gcp-secretmanager   = ["dep:google-cloud-secretmanager-v1", "dep:google-cloud-gax"]
windows            = []


